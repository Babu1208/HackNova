<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sign Up Form</title>

  <link rel="stylesheet" href="/src/output.css" />

</head>

<body
  class="bg-[#1a1a1a] text-black flex items-center justify-center min-h-screen p-4"
>

  <!-- Form Box -->
  <div
    class="w-full max-w-lg bg-white rounded-lg p-6"
  >

    <!-- Title -->
    <div class="mb-6">

      <h2
        class="text-2xl font-bold text-[#1a1a1a]"
      >
        Sign Up
      </h2>

      <p
        class="text-sm text-gray-600"
      >
        Please fill this form to create an account.
      </p>

    </div>


    <form
      action="#"
      method="POST"
      class="space-y-4"
    >

      <!-- First Name & Last Name -->
      <div
        class="grid grid-cols-1 sm:grid-cols-2 gap-4"
      >

        <div>

          <label
            for="first-name"
            class="block text-sm font-medium mb-1"
          >
            First Name
          </label>

          <input
            type="text"
            id="first-name"
            name="first-name"
            placeholder="First name"
            required
            class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:border-black"
          />

        </div>


        <div>

          <label
            for="last-name"
            class="block text-sm font-medium mb-1"
          >
            Last Name
          </label>

          <input
            type="text"
            id="last-name"
            name="last-name"
            placeholder="Last name"
            required
            class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:border-black"
          />

        </div>

      </div>


      <!-- Email -->
      <div>

        <label
          for="email"
          class="block text-sm font-medium mb-1"
        >
          Email ID
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@mail.com"
          required
          class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:border-black"
        />

      </div>


      <!-- Mobile Number -->
      <div>

        <label
          for="mobile"
          class="block text-sm font-medium mb-1"
        >
          Mobile Number
        </label>

        <input
          type="tel"
          id="mobile"
          name="mobile"
          placeholder="Mobile number"
          required
          class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:border-black"
        />

      </div>


      <!-- Password & Confirm Password -->
      <div
        class="grid grid-cols-1 sm:grid-cols-2 gap-4"
      >

        <div>

          <label
            for="password"
            class="block text-sm font-medium mb-1"
          >
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:border-black"
          />

        </div>


        <div>

          <label
            for="confirm-password"
            class="block text-sm font-medium mb-1"
          >
            Confirm Password
          </label>

          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm password"
            required
            class="w-full px-3 py-2 border border-gray-400 rounded focus:outline-none focus:border-black"
          />

        </div>

      </div>


      <!-- Gender -->
      <div>

        <span
          class="block text-sm font-medium mb-1"
        >
          Gender
        </span>

        <div
          class="flex items-center space-x-6"
        >

          <label
            class="flex items-center space-x-2 cursor-pointer"
          >

            <input
              type="radio"
              name="gender"
              value="male"
              required
              class="h-4 w-4"
            />

            <span class="text-sm">
              Male
            </span>

          </label>


          <label
            class="flex items-center space-x-2 cursor-pointer"
          >

            <input
              type="radio"
              name="gender"
              value="female"
              class="h-4 w-4"
            />

            <span class="text-sm">
              Female
            </span>

          </label>


          <label
            class="flex items-center space-x-2 cursor-pointer"
          >

            <input
              type="radio"
              name="gender"
              value="other"
              class="h-4 w-4"
            />

            <span class="text-sm">
              Other
            </span>

          </label>

        </div>

      </div>


      <!-- Terms & Conditions -->
      <div
        class="flex items-center space-x-2 pt-2"
      >

        <input
          type="checkbox"
          id="terms"
          name="terms"
          required
          class="h-4 w-4 border-gray-400 rounded"
        />

        <label
          for="terms"
          class="text-sm"
        >
          I accept the

          <a
            href="#"
            class="text-blue-900 underline"
          >
            Terms and Conditions
          </a>

        </label>

      </div>


      <!-- Sign Up Button -->
      <div class="pt-2">

        <button
          type="submit"
          class="w-full py-2 px-4 bg-[rgba(6,153,250,0.985)] text-white font-medium rounded-lg hover:bg-blue-600"
        >
          Sign Up
        </button>

      </div>


      <!-- Login -->
      <p
        class="text-center text-sm pt-2"
      >
        Already have an account?

        <a
          href="/src/login.html"
          target="_blank"
          class="text-blue-900"
        >
          Login
        </a>

      </p>

    </form>

  </div>

</body>

</html>
