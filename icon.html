<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="w-full bg-[#f4f2ff] rounded-2xl p-5 my-4 border border-purple-100 shadow-sm">
  <div class="flex flex-col lg:flex-row items-center justify-between gap-6">
    
    <!-- Title -->
    <div class="shrink-0 text-center lg:text-left">
      <div class="text-lg font-bold text-gray-900">
        Getting started is quick and easy
      </div>
    </div>

    <!-- Steps -->
    <div class="flex flex-wrap lg:flex-nowrap items-center justify-center gap-3">
      
      <!-- 1. Upload -->
      <div class="flex flex-col items-center text-center w-20">
        <div class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center text-blue-600 border border-purple-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
        </div>
        <div class="mt-1.5 text-xs font-medium text-gray-700">Upload</div>
      </div>

      <!-- Arrow -->
      <div class="text-gray-400 text-xs hidden sm:block">➔</div>

      <!-- 2. Secure Storage -->
      <div class="flex flex-col items-center text-center w-24">
        <div class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center text-emerald-600 border border-purple-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <div class="mt-1.5 text-xs font-medium text-gray-700">Secure Storage</div>
      </div>

      <!-- Arrow -->
      <div class="text-gray-400 text-xs hidden sm:block">➔</div>

      <!-- 3. Organize By Case -->
      <div class="flex flex-col items-center text-center w-28">
        <div class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center text-indigo-600 border border-purple-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
        </div>
        <div class="mt-1.5 text-xs font-medium text-gray-700">Organize By Case</div>
      </div>

      <!-- Arrow -->
      <div class="text-gray-400 text-xs hidden sm:block">➔</div>

      <!-- 4. Authorized Access -->
      <div class="flex flex-col items-center text-center w-28">
        <div class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center text-purple-600 border border-purple-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <div class="mt-1.5 text-xs font-medium text-gray-700">Authorized Access</div>
      </div>

      <!-- Arrow -->
      <div class="text-gray-400 text-xs hidden sm:block">➔</div>

      <!-- 5. Track Activity -->
      <div class="flex flex-col items-center text-center w-24">
        <div class="w-11 h-11 rounded-full bg-white shadow-sm flex items-center justify-center text-rose-500 border border-purple-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <div class="mt-1.5 text-xs font-medium text-gray-700">Track Activity</div>
      </div>

    </div>

  </div>
</div>
  
</body>
</html>
