<head>

  <link rel="stylesheet" href="/src/output.css" />

</head>


<body
  class="font-sans bg-[#1a1a1a] m-0 p-4 min-h-screen flex justify-center items-center"
>

  <div
    class="bg-white rounded-lg p-[30px] w-full max-w-[350px] flex flex-col box-border"
  >

    <!-- Heading -->
    <h2
      class="text-[#1a1a1a] text-center mb-5 text-2xl font-bold"
    >
      Login
    </h2>


    <!-- Login Form -->
    <form class="flex flex-col w-full">

      <!-- Email -->
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Email / Phone"
        class="mb-[15px] p-[10px] rounded-[5px] border border-black w-full box-border"
      />


      <!-- Password -->
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        class="mb-2 p-[10px] rounded-[5px] border border-black w-full box-border"
      />


      <!-- Remember Me + Forgot Password -->
      <div
        class="flex justify-between items-center mb-[15px] gap-2"
      >

        <label
          for="remember-password"
          class="flex items-center gap-2 text-sm"
        >

          <input
            type="checkbox"
            id="remember-password"
          />

          <span>Remember me</span>

        </label>


        <a
          href="#"
          class="text-blue-900 text-sm whitespace-nowrap"
        >
          Forgot Password?
        </a>

      </div>


      <!-- Login Button -->
      <button
        type="submit"
        class="bg-[rgba(6,153,250,0.985)] text-white p-[10px] rounded-lg hover:bg-blue-600 w-full"
      >
        Login
      </button>


      <!-- Create Account -->
      <div
        class="text-center mt-5 text-sm"
      >

        Don't have an account?

        <a
          href="/src/sign_up.html"
          target="_blank"
          class="text-blue-900"
        >
          Create Account
        </a>

      </div>

    </form>

  </div>

</body>
